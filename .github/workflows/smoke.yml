# Installation smoke.
#
# The unit suite (ci.yml) proves the hook behaves. This one proves the thing a
# user actually does first: run the installer on their machine, next to their
# agent, and get a hook that runs. It is split in two because the halves fail
# for different reasons and want different matrices.
#
#   install  three operating systems and three Node versions, no agents needed.
#            Covers install.sh everywhere and install.ps1 on Windows.
#   command  a real, unsandboxed install on a throwaway runner, purely to prove
#            that `prmpt` resolves in a NEW shell afterwards -- the one claim
#            the sandboxed suite deliberately cannot make.
#   agents   the real Claude Code, Codex and Gemini CLI, installed from npm.
#            Covers autodetection, the plugin manifest Claude Code parses, and
#            the exact command string each host is expected to execute.
#
# The weekly schedule is not decoration. Every one of these hosts ships changes
# on its own cadence, and the failure mode when one renames an event or moves a
# config file is a plugin that installs cleanly and silently earns nothing. It
# is better to learn that here than from a user who never notices.

name: Smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # A hung agent CLI is a real failure mode -- `claude doctor` sat for 79
    # minutes on a Windows runner once. Fail in twenty, do not burn six hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20']
        include:
          # 18 is the floor the plugin claims, so it is tested rather than
          # assumed; 22 catches anything the floor version tolerates.
          - os: ubuntu-latest
            node: '18'
          - os: ubuntu-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # bash on every runner, Git Bash on Windows: that is how a Windows user
      # runs a POSIX shell script, and the only way install.sh runs there.
      - name: install.sh parses as POSIX sh
        shell: bash
        run: sh -n install.sh

      - name: install.ps1 parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: installer smoke
        shell: bash
        run: node --test test/smoke/installer.smoke.test.mjs test/smoke/windows.smoke.test.mjs

  command:
    name: prmpt on PATH · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The installer smoke suite runs in a sandbox HOME and with
      # PRMPT_NO_PATH_PERSIST=1, because the PATH entry install.ps1 writes is
      # machine state and a test must not leave it on a developer's box. That
      # leaves exactly one claim unproven: that after a REAL install, `prmpt`
      # resolves in a new shell. A throwaway runner is the only place that can
      # honestly be checked, so it is checked here and nowhere else.
      #
      # --no-login / -NoLogin is mandatory: without it the installer signs in
      # against the default endpoint, which is production, and creates a real
      # user behind a wallet that dies with the runner.
      - name: install for real, then resolve the command
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          sh install.sh --no-login --agents claude --dir "$HOME/app"
          # A fresh shell, told only what a shell rc would have told it.
          env -i HOME="$HOME" PATH="$HOME/.local/bin:/usr/bin:/bin" sh -c '
            set -eu
            command -v prmpt
            prmpt --help | grep -q "usage: prmpt"
          '

      - name: install for real, then resolve the command
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -NoLogin -Agents claude -Dir "$env:USERPROFILE\app"
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          # A NEW process taking its PATH from the registry, which is what the
          # user's next terminal does. Reading $env:PATH here would only prove
          # the installer edited its own process.
          $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          $machine  = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          # Built as a string rather than a here-string: a PowerShell here-string
          # terminator has to sit in column zero, which cannot happen inside a
          # YAML block scalar.
          $child = "`$env:PATH = '$machine;$userPath'; " +
                   "if (-not (Get-Command prmpt -ErrorAction SilentlyContinue)) { exit 9 }; " +
                   "prmpt --help"
          # pwsh -Command returns output as a string ARRAY, one element per
          # line. -match/-notmatch on an array filter element-wise and
          # return the (possibly non-empty, thus truthy) filtered array, not
          # a boolean -- so an unjoined $out would throw here even on a
          # match, because most lines don't contain the needle. Join first.
          $out = (pwsh -NoProfile -Command $child) -join "`n"
          if ($LASTEXITCODE -eq 9) { throw 'prmpt did not resolve from the user PATH' }
          if ($LASTEXITCODE -ne 0) { throw "prmpt did not run: $out" }
          if ($out -notmatch 'usage: prmpt') { throw "unexpected output: $out" }

      # Uninstall is half the contract: the command goes away with the install
      # it points at, and the PATH entry goes with it.
      - name: uninstall takes it back off
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux
          sh install.sh --uninstall --dir "$HOME/app"
          test ! -e "$HOME/.local/bin/prmpt"

      - name: uninstall takes it back off
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install.ps1 -Uninstall -Dir "$env:USERPROFILE\app"
          if (Test-Path "$env:USERPROFILE\.local\bin\prmpt.cmd") { throw 'the shim survived -Uninstall' }
          $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          if (($userPath -split ';') -contains "$env:USERPROFILE\.local\bin") {
            throw 'the PATH entry survived -Uninstall'
          }

  agents:
    name: agents · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Every supported host ships as an npm global, which is what makes this
      # job possible at all: the agents install unauthenticated, and everything
      # short of running a turn works without credentials.
      - name: install the agent CLIs
        shell: bash
        run: |
          npm install -g \
            @anthropic-ai/claude-code \
            @openai/codex \
            @google/gemini-cli

      - name: the agents are on PATH
        shell: bash
        run: |
          set -eux
          claude --version
          codex --version
          gemini --version

      - name: agent smoke
        shell: bash
        # A missing agent makes this suite skip rather than fail, which would
        # turn a broken install step into a green build. This makes it explicit.
        env:
          PRMPT_SMOKE_REQUIRE_AGENTS: '1'
        run: node --test test/smoke/agents.smoke.test.mjs

  linux-editor:
    name: editor integration · linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # This is the real Linux distribution, not a mock of its command-line
      # interface.  We only use its non-interactive extension commands, so no
      # display server or user profile is involved.
      - name: install VS Code CLI
        run: |
          set -eux
          curl -fsSL https://update.code.visualstudio.com/latest/linux-deb-x64/stable -o /tmp/code.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/code.deb xvfb
          code --version

      - name: build and test the editor extension
        working-directory: vscode
        run: |
          set -eux
          npm ci --no-audit --no-fund
          npm test
          npx vsce package --no-dependencies --out ../prmpt-linux-e2e.vsix

      - name: install the packaged extension through VS Code
        env:
          PRMPT_SMOKE_REQUIRE_LINUX_E2E: '1'
          PRMPT_CODE_BIN: /usr/bin/code
          PRMPT_VSIX: ${{ github.workspace }}/prmpt-linux-e2e.vsix
        run: npm run test:e2e:linux

      - name: render a mock ad in the real VS Code UI
        working-directory: vscode
        env:
          PRMPT_SMOKE_REQUIRE_LINUX_UI: '1'
          PRMPT_CODE_BIN: /usr/bin/code
          PRMPT_CODE_APP: /usr/share/code/code
          PRMPT_VSIX: ${{ github.workspace }}/prmpt-linux-e2e.vsix
          PRMPT_UI_ARTIFACT_DIR: ${{ github.workspace }}/ui-artifacts
        run: xvfb-run -a npm run test:e2e:ui

      - name: upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-editor-ui
          path: ui-artifacts/
          if-no-files-found: warn
