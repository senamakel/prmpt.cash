name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor the plugin claims to support, so it is tested, not
        # assumed. The hook has no dependencies, so there is nothing to install.
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Scoped to test/ deliberately. A bare `node --test` walks the tree
      # recursively and would pull in vscode/test/, which imports esbuild --
      # a devDependency this job does not install, and should not have to. The
      # editor extension has its own job below.
      - run: node --test test/*.test.mjs

  vscode:
    name: editor extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # A single version, not the matrix above: this package is only ever
          # run by the editor's own Node, so testing the plugin's supported
          # floor against it proves nothing.
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      # vsce only ships a LICENSE that sits in the package directory, so the
      # extension carries its own copy. Two copies can drift, and a vsix whose
      # licence disagrees with the repo's is worse than one carrying none.
      - name: the extension's LICENSE is the repo's, verbatim
        run: cmp LICENSE vscode/LICENSE
      - name: install
        working-directory: vscode
        run: npm ci
      # esbuild strips types without checking them, so nothing in the build or
      # the test run would catch a type error on its own.
      - name: typecheck
        working-directory: vscode
        run: npx tsc --noEmit
      # The load-bearing assertion in here is that the script injected into
      # Cursor's workbench.js parses. A syntax error in it lands inside
      # Cursor's startup path, and the symptom is an editor that will not open.
      - name: test
        working-directory: vscode
        run: npm test
      # Packaging is how this reaches anybody, and it fails on problems the
      # tests cannot see -- a missing icon, a bad manifest field. release.yml
      # does this too, but only once a tag is already cut.
      - name: package
        working-directory: vscode
        run: npx vsce package --no-dependencies --out /tmp/prmpt-vscode-ci.vsix

  lint:
    name: shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - run: shellcheck -s sh install.sh || true

  # End-to-end installation — install.sh and install.ps1 on Linux, macOS and
  # Windows, and against the real Claude Code / Codex / Gemini CLI — lives in
  # smoke.yml. It used to be a single ubuntu job here, which meant every
  # Windows and macOS installation bug shipped.
